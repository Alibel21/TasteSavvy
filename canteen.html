<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知味</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f5f2;color:#222}
header{background:#2e7d4f;color:#fff;padding:14px 24px;font-size:18px;font-weight:bold;cursor:pointer}
header small{margin-left:12px;font-weight:normal;font-size:13px;opacity:.85}
.top{max-width:760px;margin:0 auto;padding:22px 16px 6px;text-align:center}
#markerBtn{border:0;background:#fff3d6;color:#a35a00;font-size:17px;font-weight:bold;padding:12px 26px;border-radius:30px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);animation:bob 1.6s ease-in-out infinite}
#markerBtn:hover{background:#ffe7a8}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#markerWrap{margin-bottom:16px}
#sf{display:flex;align-items:center;background:#fff;border:2px solid #2e7d4f;border-radius:28px;padding:4px 6px 4px 18px}
#q{flex:1;border:0;outline:0;font-size:16px;padding:10px 0;background:transparent}
.cam{cursor:pointer;font-size:22px;padding:4px 10px}
#sf button{border:0;background:#2e7d4f;color:#fff;border-radius:22px;padding:9px 20px;font-size:15px;cursor:pointer}
#status{margin-top:10px;font-size:14px;color:#555;min-height:18px}
#status button{margin:6px 6px 0 0;padding:6px 14px;border:1px solid #2e7d4f;background:#fff;color:#2e7d4f;border-radius:16px;cursor:pointer}
#view{padding:10px 24px 40px}
.back{border:0;background:none;color:#2e7d4f;font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:6px}
.sec{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec h3{margin:0 0 8px;font-size:16px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-top:1px solid #eee;cursor:pointer}
.srow:hover{background:#f4faf6}
.sub{font-size:13px;color:#888;margin-top:2px}
.cnt{font-size:14px;color:#555;white-space:nowrap}
.price{color:#888;font-size:13px;margin-left:6px;font-weight:normal}
.rcard{max-width:760px;margin:10px auto;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.rtitle{font-size:13px;color:#2e7d4f;font-weight:bold;margin-bottom:6px}
.bigname{font-size:24px;font-weight:bold}
.pair{margin-top:8px;font-size:14px;background:#f4faf6;padding:8px 10px;border-radius:8px}
.rbtn{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.rbtn button,.btns button{border:1px solid #ddd;background:#fff;border-radius:16px;padding:6px 14px;font-size:14px;cursor:pointer}
.rbtn button:hover,.btns button:hover{background:#f4f4f4}
.btns button.on{background:#ffe9e0;border-color:#ff8a5c}
.msg{margin-top:8px;font-size:13px;color:#2e7d4f}
.notice{background:#fff8e1;color:#8a6d00;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.dish{padding:12px 0;border-top:1px solid #eee}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dname{font-size:16px;font-weight:bold}
.tags{font-size:12px;color:#999;margin-top:3px}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.bdg{font-size:12px;padding:2px 9px;border-radius:10px;white-space:nowrap;font-weight:bold}
.bdg.like{background:#fff1e6;color:#b45309}.bdg.fav{background:#fff8d6;color:#8a6d00}
.bdg.rev{background:#e8f0fe;color:#1a56a0}.bdg.taste{background:#e6f6ec;color:#1e7a46}
.sortbar{margin:2px 0 8px;font-size:13px;color:#666}
.chip{display:inline-block;padding:4px 12px;margin-left:6px;border-radius:14px;background:#eee;cursor:pointer}
.chip.on{background:#2e7d4f;color:#fff}
.revbox{margin-top:8px;padding:8px 10px;background:#fafafa;border-radius:8px;font-size:14px;color:#555}
.revbox div.r{padding:3px 0}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;padding:7px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.add button{padding:7px 16px;background:#2e7d4f;color:#fff;border:0;border-radius:6px;cursor:pointer}
.empty{text-align:center;color:#888;padding:30px}
.hint{text-align:center;font-size:12px;color:#999;padding:0 16px 24px}
</style>
</head>

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
CANTEENS.forEach(c=>c.windows.forEach(w=>w.dishes.forEach(d=>{
  const r=mulberry32(hashStr(w.id+"|"+d.n));
  const total=Math.round(Math.pow(r(),2.2)*36);            // 多数偏低、少数较高
  const spicy=d.t.includes("辣"), light=d.t.some(t=>t==="清淡"||t==="低脂"||t==="素");
  const a=Math.round(total*(spicy?0.15:light?0.6:0.4));      // 按口味类型拆分：[清淡型, 嗜辣型]
  d.s=[a,total-a];
  d.f=Math.round(total*(0.15+r()*0.35));                     // 收藏数
})));

function myType(){
  let best=null,bs=0;
  TYPES.forEach(ty=>{const v=TYPE_TAGS[ty].reduce((a,t)=>a+(S.tag[t]||0),0);if(v>bs){bs=v;best=ty}});
  return best;
}
function weight(x){
  const r=rec(x.id);
  let w=1+Math.sqrt(pop(x))*0.8;                                   // 人气
  const taste=x.dish.t.reduce((a,t)=>a+(S.tag[t]||0),0); // 个人口味
  if(taste>0) w*=1+Math.min(taste,6)*0.4;
  if(taste<0) w*=0.3;
  w*=(r.myLike||r.myFav)?0.4:1.4;                        // 探索：没点赞收藏过的优先
  const ty=myType();                                      // 同口味类型同学的点赞
  if(ty) w+=Math.sqrt(x.dish.s[TYPES.indexOf(ty)])*0.8;
  return Math.max(w,0.05);
}
function wpick(arr,f){
  const ws=arr.map(f);let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}
  return arr[arr.length-1];
}
function reasonOf(x){
  const m=x.dish.t.filter(t=>(S.tag[t]||0)>0);
  if(m.length) return "和你点赞、收藏过的「"+m.join("」「")+"」口味相近";
  return Object.values(S.tag).some(v=>v>0)?"和你以往的偏好不同，换个新口味试试":"还没有你的偏好记录，先随机推荐";
}

    const dp=ALL.filter(y=>y.canteen===x.canteen&&y.dish.k==="dish");

    const mp=ALL.filter(y=>y.win.id===x.win.id&&y.dish.k==="meal");
    if(mp.length) pair=wpick(mp,weight);

}

function termView(q){

      <div class="tags">${x.dish.t.map(esc).join(" · ")}</div></div>
      <div class="rside"><div class="badges">${badgesOf(x,m)}</div>
      <div class="btns"><button class="${r.myLike?"on":""}" data-act="like" data-id="${esc(x.id)}">👍 ${likes(x)}</button>
      <button class="${r.myFav?"on":""}" data-act="fav" data-id="${esc(x.id)}">⭐ ${favs(x)}</button>
      <button data-act="rev" data-id="${esc(x.id)}">💬 ${nrev(x)}</button></div></div></div>
      ${open?`<div class="revbox">${r.rev.map(t=>`<div class="r">· ${esc(t)}</div>`).join("")||"还没有评价"}
      <div class="add"><input data-rid="${esc(x.id)}" placeholder="写一句评价（60字内）"><button data-act="send" data-id="${esc(x.id)}">发送</button></div></div>`:""}</div>`;
  }).join("");
  return out+`</div>`;
}

// ================= 事件 =================
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="win"){SORT="mix";go({p:"win",id})}
  else if(a==="sort"){SORT=id;render()}
  else if(a==="dish") go({p:"dish",id});
  else if(a==="back"){if(stack.length>1)stack.pop();render()}
  else if(a==="home"){stack=[{p:"home"}];document.getElementById("status").innerHTML="";render()}
  else if(a==="rnd") pickRec();
  else if(a==="rnext"){if(RC)addPref(RC.x.dish,-0.3);pickRec()}
  else if(a==="rdis"){if(RC)addPref(RC.x.dish,-1);pickRec()}
  else if(a==="rlike"){addPref(RC.x.dish,1);RC.msg="已记录：你喜欢这类口味，之后会多推荐相近的";render()}
  else if(a==="like"||a==="fav"){
    const r=rec(id), k=a, m=a==="like"?"myLike":"myFav";
    r[m]=!r[m]; r[k]+=r[m]?1:-1; addPref(BY[id].dish,r[m]?1:-1); save(); render();
  }
  else if(a==="rev"){OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render()}
  else if(a==="send") sendRev(id);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.rid){e.preventDefault();sendRev(e.target.dataset.rid)}
});
function sendRev(id){
  const inp=[...document.querySelectorAll("input[data-rid]")].find(i=>i.dataset.rid===id);
  const v=inp&&inp.value.trim(); if(!v) return;
  rec(id).rev.push(v.slice(0,60)); OPEN.add(id); save(); render();
}
document.getElementById("sf").addEventListener("submit",e=>{
  e.preventDefault();
  const q=document.getElementById("q").value.trim(); if(!q) return;
  document.getElementById("status").innerHTML="";
  stack=[{p:"home"}]; go({p:"search",q});
});

// ================= 拍照识别窗口 =================
const pic=document.getElementById("pic");
pic.onchange=async()=>{
  const f=pic.files[0]; if(!f) return;
  const box=document.getElementById("status");
  box.textContent="识别中…";
  try{
    const img=await shrink(f);
    const r=await fetch("/api/recognize",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image:img,windows:Object.values(WINS).map(w=>({id:w.id,name:w.canteen+" "+w.name}))})});
    const d=await r.json();
    if(d.error){box.textContent="识别失败："+d.error+"。试试在搜索框里搜窗口名";return}
    let ids=(d.candidates||[]).filter(id=>WINS[id]);
    if(!ids.length) ids=localMatch(d.read_text||"");
    if(!ids.length){box.textContent="没认出来（读到："+(d.read_text||"无")+"）。试试在搜索框里搜窗口名";return}
    box.innerHTML="读到："+esc(d.read_text||"")+"。是哪个窗口？<br>"+ids.map(id=>`<button data-act="win" data-id="${id}">${esc(WINS[id].canteen+" "+WINS[id].name)}</button>`).join("");
  }catch(err){box.textContent="识别失败："+(err.message==="Failed to fetch"?"没连上本地服务，请确认命令窗口里 python server.py 还在运行，并且是用 http://localhost:8000 打开的页面":err.message)+"。也可以在搜索框里搜窗口名"}
  pic.value="";
};
function localMatch(text){
  const t=String(text).replace(/\s+/g,"");
  if(!t) return [];
  return Object.values(WINS).map(w=>{
    const nm=w.name.replace(/\s+/g,""), grams=nm.length<2?[nm]:[...nm].slice(0,-1).map((c,i)=>nm.slice(i,i+2));
    return {id:w.id,sc:grams.filter(g=>t.includes(g)).length};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3).map(x=>x.id);
}
function shrink(file){return new Promise((ok,no)=>{const im=new Image();
  im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.8))};
  im.onerror=()=>no(new Error("图片读取失败"));im.src=URL.createObjectURL(file)})}

render();
</script>
</body>
